  <style>
    :root {

      --ink: #252b23;
      --muted: #62675c;
      --accent: #b34724;
      --line: #d7dacb;

    * { box-sizing: border-box; }
    body {

    }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
    .page { max-width: 1440px; min-height: 100vh; min-height: 100svh; margin: auto; padding: 0 6%; display: flex; flex-direction: column; }
    header { min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 13px; text-decoration: none; font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
    .monogram { display: grid; place-items: center; width: 37px; height: 37px; background: var(--ink); color: var(--paper); border-radius: 50%; font-size: 13px; letter-spacing: -1px; }
    .header-note, .eyebrow, .coordinates, footer { font-family: "Courier New", monospace; }
    .header-note { font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; }
    .header-note::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 10px; }
    main { flex: 1; padding: 68px 0 74px; display: grid; grid-template-columns: 1.04fr 1fr; gap: 5%; align-items: center; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1.7px; text-transform: uppercase; margin: 0 0 15px; }
    .error-number { font-size: clamp(104px, 12.6vw, 172px); font-weight: 750; letter-spacing: -.09em; line-height: .96; margin: 0 0 29px -8px; }
    .error-number span { color: var(--accent); }
    h1 { font-size: clamp(36px, 4.05vw, 55px); line-height: 1.06; letter-spacing: -.055em; font-weight: 600; margin: 0 0 25px; }
    h1 span { display: block; }
    .french { font-size: 16px; line-height: 1.6; margin: 0 0 7px; font-weight: 600; }
    .description { color: var(--muted); max-width: 355px; font-size: 15px; line-height: 1.75; margin: 0 0 30px; }
    .home-link { display: inline-flex; align-items: center; justify-content: center; gap: 27px; background: var(--ink); color: #fff; text-decoration: none; padding: 17px 23px; border-radius: 7px; font-size: 14px; font-weight: 600; transition: background .18s, transform .18s; }
    .home-link:hover { background: var(--accent); transform: translateY(-2px); }
    .home-link svg { width: 17px; height: 17px; }
    .art { position: relative; margin: 0; }
    .map-art { width: 100%; height: auto; display: block; }
    .coordinates { color: var(--muted); text-align: center; font-size: 10px; letter-spacing: 1.4px; margin-top: 14px; }
    .compass { transform-origin: 455px 84px; animation: compass-sway 8s ease-in-out infinite; }
    @keyframes compass-sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; border-top: 1px solid var(--line); min-height: 76px; color: var(--muted); font-size: 10px; line-height: 1.6; letter-spacing: 1.1px; text-transform: uppercase; }
    .footer-right { display: flex; align-items: center; gap: 12px; }
    .footer-line { width: 30px; height: 1px; background: var(--accent); }
    @media (min-width: 1441px) { .page { padding-inline: 86px; } }
    @media (max-width: 760px) {
      .page { padding: 0 7%; }
      header { min-height: 80px; }
      .header-note { font-size: 9px; letter-spacing: 1px; }
      main { grid-template-columns: 1fr; gap: 38px; padding: 45px 0; }
      .error-number { font-size: 116px; margin-left: -5px; margin-bottom: 22px; }
      h1 { font-size: clamp(36px, 8vw, 49px); }
      .description { max-width: 430px; }
      .art { width: 100%; max-width: 450px; margin: 0 auto; }
      footer { padding: 20px 0; min-height: 76px; font-size: 9px; }
    }
    @media (max-width: 360px) { .header-note { display: none; } .footer-line { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
